[project]
name = "kaoshile"
version = "0.1.0"
description = "考试通知软件（kaoshile）— 用户订阅考试，系统在关键时间点通过阿里云邮件/短信提醒"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "freezegun>=1.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyyaml>=6.0",
]
aliyun = [
    "alibabacloud_dysmsapi20170525>=1.0",
    "alibabacloud_dm20151123>=1.0",
    "alibabacloud_tea_openapi>=0.3",
]
redis_lock = [
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: 集成测试，跨模块端到端（CI 默认包含）",
    "smoke: 冒烟脚本配套测试",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",                                  # 仅做 wiring
    "app/__init__.py",
    "app/services/template_renderer.py",            # 旧实现死代码，V3.4 后由 notification/templates/render.py 取代
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]  # 行长度由 formatter 处理

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
