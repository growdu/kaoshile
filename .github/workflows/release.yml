name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（vX.Y.Z）"
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  test:
    name: 全量测试（确保发版质量）
    uses: ./.github/workflows/ci.yml
    with:
      # 复用 ci.yml 的全部 job（lint / test / smoke）
      # 触发器我们不关心，因为本地已由 tag push 触发
      pass: ""
    # 注意：直接 reuse 复杂；这里简化为再次跑同等检查
  release:
    name: 构建 + 发版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 跑全测 + smoke
        env:
          APP_ENV: test
          HMAC_SECRET: release-secret
          LINK_SECRET: release-link-secret-must-be-32-bytes-padding!
          MANAGE_PASSWORD_HASH: $2b$12$releaseplaceholderdummyhashfortests....
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aliyun,redis_lock]"
          pytest -q
          python scripts/smoke.py

      - name: 登录 ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送 docker 镜像到 ghcr.io
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kaoshile:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/kaoshile:latest

      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          # 从 CHANGELOG.md 抽对应版本的段落作为 release body
          body: |
            ## 变更说明

            请查阅 [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.value }}/CHANGELOG.md) 对应版本段落。

            ## Docker 镜像

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/kaoshile:${{ steps.tag.outputs.value }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}