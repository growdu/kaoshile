name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消上一次同 workflow、同 ref 仍在跑的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 测试运行所需的最小环境变量（与 scripts/smoke.py / conftest.py 一致）
  APP_ENV: test
  HMAC_SECRET: ci-secret
  LINK_SECRET: ci-link-secret-must-be-32-bytes-padding!
  MANAGE_PASSWORD_HASH: $2b$12$ciplaceholderdummyhashfortests.....

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    # 预先存在的 ruff 报告问题不在 v6.2 范围；这里先产出报告不挡路，
    # 后续 v6.4+ 计划删除「不再发现」后收紧为默认。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装 ruff
        run: pip install "ruff>=0.5"
      - name: ruff check
        run: |
          ruff check app tests --output-format=github > ruff-check.txt || true
          cat ruff-check.txt
      - name: ruff format --check
        run: |
          ruff format --check app tests scripts > ruff-format.txt || true
          cat ruff-format.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruff-report
          path: |
            ruff-check.txt
            ruff-format.txt
          retention-days: 30

  test:
    name: pytest + coverage (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装依赖（含 dev / aliyun / redis_lock extras）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aliyun,redis_lock]"
      - name: 测试 + 覆盖率
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing -q
      - name: 上传 coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

  smoke:
    name: end-to-end smoke (scripts/smoke.py)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,aliyun,redis_lock]"
      - name: 跑端到端冒烟（8 步主链路）
        run: python scripts/smoke.py

  docker:
    name: docker build (仅 main 分支)
    # 仅守门 main 分支，避免 PR 拉镜像耗时 / 缓存命中低
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Dockerfile 语法
        run: |
          # 不真构建大镜像，仅校验能加载并解析
          docker build --target base --progress plain .
      - uses: actions/upload-artifact@v7
        with:
          name: docker-build-log
          path: docker-build.log
          if-no-files-found: ignore